# BRAIN-style submission checks used by Alpha Foundry's local proxy simulator.
# Values marked "verify" could not be confirmed against official BRAIN documentation;
# adjust them here (or on the Settings page, which writes runtime/checks_user.yaml).

delay1:
  sharpe_min: 1.25
  fitness_min: 1.0
delay0:
  sharpe_min: 2.0        # verify
  fitness_min: 1.3       # verify

turnover_min: 0.01       # 1%
turnover_max: 0.70       # 70%
max_weight: 0.10         # CONCENTRATED_WEIGHT: largest single-stock weight
sub_universe_factor: 0.75  # verify: sub Sharpe >= factor * sqrt(sub/univ) * Sharpe
self_corr_max: 0.70
self_corr_sharpe_improvement: 0.10   # correlated alpha allowed if Sharpe is >= 10% higher
self_corr_years: 4       # PnL window (most recent IS years) used for correlation
two_year_sharpe_min: 1.0 # verify: soft check on the most recent 2 IS years

# Alpha Foundry robustness gates (not BRAIN checks; reported as warnings)
local_gates:
  os_is_ratio_min: 0.5         # OS Sharpe / IS Sharpe
  positive_years_min: 0.7      # share of IS years with positive PnL
  stability_min: 0.7           # Sharpe retained when windows are perturbed +/-25%
  drawdown_max: 0.5            # max drawdown (fraction of half book)

# Alpha Foundry quality grade (A = BRAIN-ready ... D). Local metrics are a proxy for BRAIN's, so an alpha
# must clear BRAIN's thresholds with a margin and show evidence the edge is real before it is graded A.
quality:
  sharpe_margin: 1.25          # local IS Sharpe >= 1.25 x BRAIN minimum (1.56 at delay 1)
  fitness_margin: 1.25         # local IS fitness >= 1.25 x BRAIN minimum
  turnover_band: [0.03, 0.45]  # comfortable band inside the 1%-70% limits
  brain_window_margin: 1.0     # Sharpe over the latest 5 IS years (BRAIN-like window) >= minimum
  os_sharpe_min: 0.6           # holdout Sharpe stays clearly positive ...
  os_ratio_min: 0.45           # ... and keeps this share of the IS Sharpe
  stability_min: 0.7           # Sharpe kept when every window moves +/-25%
  positive_years_min: 0.7      # share of profitable IS years
  max_complexity: 40           # expression nodes
  near_miss: 0.8               # grade C: the one failing value is within 80% of its limit
