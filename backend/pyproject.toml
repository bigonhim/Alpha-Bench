[project]
name = "alphafoundry"
version = "1.0.0"
description = "Offline WorldQuant BRAIN alpha generation studio: Fast Expression engine, BRAIN-like proxy simulator, and alpha miners."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=2.0",
    "numba>=0.61",
    "httpx>=0.27",
    "pandas>=2.2",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
]

[project.scripts]
alphafoundry = "alphafoundry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphafoundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
